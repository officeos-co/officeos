apiVersion: eaos.dev/v1
kind: MemoryStore
metadata:
  name: mesh-routing-map
spec:
  displayName: Agent Mesh Routing Map
  entries:
    - key: product-agent
      content: Ask product-agent about roadmap, scope, prioritization, feature definitions, and product tradeoffs.
    - key: engineering-agent
      content: Ask engineering-agent about implementation, architecture, APIs, incidents, technical risk, and estimates.
    - key: support-agent
      content: Ask support-agent about customers, tickets, defects, escalations, and support policy.
    - key: sales-agent
      content: Ask sales-agent about prospects, pipeline, objections, commercial fit, and account context.
    - key: marketing-agent
      content: Ask marketing-agent about launches, positioning, campaigns, website copy, and content calendars.
    - key: finance-agent
      content: Ask finance-agent about budgets, revenue, invoices, renewals, costs, and forecasts.
    - key: legal-agent
      content: Ask legal-agent about contracts, privacy, risk, terms, procurement, and compliance language.
    - key: hr-agent
      content: Ask hr-agent about hiring, onboarding, policies, benefits, and team process.
    - key: operations-agent
      content: Ask operations-agent about vendors, internal process, systems, procurement, and operational runbooks.
    - key: security-agent
      content: Ask security-agent about access, vulnerabilities, security reviews, incident response, and controls.
---
apiVersion: eaos.dev/v1
kind: Agent
metadata:
  name: main-coordinator-agent
spec:
  provider: anthropic
  model: claude-sonnet-4-6
  description: Routes questions to the ten Slack-specialist agents through the internal channel.
  system: You are the main coordinator. Break user requests into department questions and ask the specialist agents through internal_channel_send. Use the agent mesh internal channel resource. The current tool requires the channel_connection_id UUID; get it from the apply/diff output for Channel/agent-mesh-internal. Ask concise questions, wait for specialist replies, then synthesize one answer.
  tools:
    builtin:
      permissionPolicy:
        type: allow_list
        tools:
          - internal_channel_send
          - memory_recall
          - task_create
          - task_list
          - task_update
  channels:
    - ref: agent-mesh-internal
      config:
        canSend: true
        canReceive: true
        replyOnly: false
        label: coordinator
  memoryStores:
    - ref: mesh-routing-map
      accessMode: read_only
      instructions: Use this map to decide which specialist agents to ask.
---
apiVersion: eaos.dev/v1
kind: Agent
metadata:
  name: product-agent
spec:
  provider: anthropic
  model: claude-sonnet-4-6
  description: Product specialist connected to the product Slack channel.
  system: You are the product specialist. Answer product, roadmap, prioritization, scope, and customer-problem questions. Reply clearly when the main coordinator asks through the internal channel.
  channels:
    - ref: slack-product
      config:
        canSend: true
        canReceive: true
        label: product-slack
    - ref: agent-mesh-internal
      config:
        canSend: false
        canReceive: true
        label: product-specialist
