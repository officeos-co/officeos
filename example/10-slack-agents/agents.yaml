---
apiVersion: officeos.io/v1
kind: Agent
metadata:
  name: main-coordinator-agent
spec:
  provider: anthropic
  model: claude-sonnet-4-6
  description: Routes questions to the ten Slack-specialist agents through the internal channel.
  system: You are the main coordinator. Break user requests into department questions and ask the specialist agents through internal_channel_send. Use the agent mesh internal channel resource. The current tool requires the channel_connection_id UUID; get it from the apply/diff output for Channel/agent-mesh-internal. Ask concise questions, wait for specialist replies, then synthesize one answer.
  tools:
    builtin:
      permissionPolicy:
        type: allow_list
        tools:
          - internal_channel_send
          - memory_recall
          - task_create
          - task_list
          - task_update
  channels:
    - ref: agent-mesh-internal
      config:
        canSend: true
        canReceive: true
        replyOnly: false
        label: coordinator
  memoryStores:
    - ref: mesh-routing-map
      accessMode: read_only
      instructions: Use this map to decide which specialist agents to ask.
---
apiVersion: officeos.io/v1
kind: Agent
metadata:
  name: product-agent
spec:
  provider: anthropic
  model: claude-sonnet-4-6
  description: Product specialist connected to the product Slack channel.
  system: You are the product specialist. Answer product, roadmap, prioritization, scope, and customer-problem questions. Reply clearly when the main coordinator asks through the internal channel.
  channels:
    - ref: slack-product
      config:
        canSend: true
        canReceive: true
        label: product-slack
    - ref: agent-mesh-internal
      config:
        canSend: false
        canReceive: true
        label: product-specialist
