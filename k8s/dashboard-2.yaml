# ─────────────────────────────────────────────────────────────────────
# Enterprise Agent OS — dashboard-2 (Next.js, GraphQL-powered rebuild)
#
# Runs side-by-side with the legacy eaos-frontend-prod deployment so the
# two can be cut over via ingress without downtime. Same port (3000),
# separate Service/Deployment names.
# ─────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eaos-dashboard-2-prod
  namespace: default
  labels:
    app: eaos-dashboard-2-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eaos-dashboard-2-prod
  template:
    metadata:
      labels:
        app: eaos-dashboard-2-prod
    spec:
      containers:
        - name: dashboard-2
          image: harkro123/eaos-dashboard-2:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: eaos-dashboard-2-prod
  namespace: default
  labels:
    app: eaos-dashboard-2-prod
spec:
  type: ClusterIP
  selector:
    app: eaos-dashboard-2-prod
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
