# ─────────────────────────────────────────────────────────────────────
# Enterprise Agent OS — changelog (Next.js changelog site)
#
# Public-facing changelog. Reads from .md files at build time.
# ─────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eaos-changelog-prod
  namespace: default
  labels:
    app: eaos-changelog-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eaos-changelog-prod
  template:
    metadata:
      labels:
        app: eaos-changelog-prod
    spec:
      containers:
        - name: changelog
          image: harkro123/eaos-changelog:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: eaos-changelog-prod
  namespace: default
  labels:
    app: eaos-changelog-prod
spec:
  type: ClusterIP
  selector:
    app: eaos-changelog-prod
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
