{{- if .Values.docs.enabled }}
{{- $name := include "enterprise-agent-os.componentName" (dict "root" . "component" "docs") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "enterprise-agent-os.componentLabels" (dict "root" . "component" "docs") | nindent 4 }}
spec:
  replicas: {{ .Values.docs.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "enterprise-agent-os.selectorLabels" (dict "root" . "component" "docs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "enterprise-agent-os.selectorLabels" (dict "root" . "component" "docs") | nindent 8 }}
    spec:
      containers:
        - name: docs
          image: "{{ .Values.docs.image.repository }}:{{ .Values.docs.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            {{- toYaml .Values.docs.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "enterprise-agent-os.componentLabels" (dict "root" . "component" "docs") | nindent 4 }}
spec:
  type: {{ .Values.docs.service.type }}
  selector:
    {{- include "enterprise-agent-os.selectorLabels" (dict "root" . "component" "docs") | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.docs.service.port }}
      targetPort: 3000
{{- end }}

