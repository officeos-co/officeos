# ─────────────────────────────────────────────────────────────────────
# Enterprise Agent OS — backend stack
#
# Everything the backend needs to run: RBAC, the backend PVC,
# and the backend Deployment + Service. Postgres is external (REDACTED_DB_HOST_IP).
#
# Frontend lives in ./frontend.yaml. Credentials are hardcoded inline
# to match the self-contained pattern used in docker-compose.yml —
# rotate by editing here and re-applying.
# ─────────────────────────────────────────────────────────────────────

# ==============================================================
# RBAC — backend needs this SA to spawn per-agent zeroclaw pods
# and clean up PVCs on agent deletion. Without the SA the backend
# Deployment's ReplicaSet can't admit any Pod (it references
# `serviceAccountName: dashboard-backend`).
# ==============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-backend
  namespace: default
  labels:
    app: eaos

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zeroclaw-manager
  namespace: default
  labels:
    app: eaos
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - persistentvolumeclaims
      - configmaps
    verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zeroclaw-manager-binding
  namespace: default
  labels:
    app: eaos
subjects:
  - kind: ServiceAccount
    name: dashboard-backend
    namespace: default
roleRef:
  kind: Role
  name: zeroclaw-manager
  apiGroup: rbac.authorization.k8s.io

---
# ==============================================================
# Postgres — hosted externally on REDACTED_DB_HOST_IP
# Databases: eaos_prod (production), eaos_staging (staging)
# User: contentmachine — connection strings in appsettings.json
# ==============================================================
# ==============================================================
# Backend DataProtection keys PVC
#
# v2 backend (dotnet) persists DataProtection keys under /data.
# Without this volume keys would vanish on every pod restart,
# invalidating every encrypted provider API key. The database
# is external Postgres on REDACTED_DB_HOST_IP.
# ==============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eaos-backend-data
  namespace: default
  labels:
    app: eaos
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
# ==============================================================
# Backend (v2 dotnet / legacy FastAPI image)
# ==============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eaos-backend-prod
  namespace: default
  labels:
    app: eaos-backend-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eaos-backend-prod
  template:
    metadata:
      labels:
        app: eaos-backend-prod
    spec:
      serviceAccountName: dashboard-backend
      initContainers:
        - name: fix-data-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1654:1654 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 0
      containers:
        - name: backend
          image: harkro123/eaos-backend:latest
          imagePullPolicy: Always
          env:
            - name: ENVIRONMENT
              value: production
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "1000Mi"
              cpu: "1000m"
            limits:
              memory: "2000Mi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        # ── WhatsApp Baileys sidecar ──────────────────────────────
        - name: whatsapp-gateway
          image: harkro123/eaos-whatsapp-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
              name: wa-gateway
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eaos-backend-data

---
apiVersion: v1
kind: Service
metadata:
  name: eaos-backend-prod
  namespace: default
  labels:
    app: eaos-backend-prod
spec:
  type: ClusterIP
  selector:
    app: eaos-backend-prod
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000

---
# ==============================================================
# Redis — in-cluster cache for session lookups and query results
# ==============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eaos-redis
  namespace: default
  labels:
    app: eaos-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eaos-redis
  template:
    metadata:
      labels:
        app: eaos-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: eaos-redis
  namespace: default
  labels:
    app: eaos-redis
spec:
  type: ClusterIP
  selector:
    app: eaos-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379

---
# ==============================================================
# Skill Runtime (Node.js — executes SDK-defined skills)
#
# Bundles first-party skills (notion, github, google) and exposes
# an HTTP API for manifest discovery and skill execution.
# The backend dispatches skill calls here via SkillRuntimeClient.
# ==============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eaos-skill-runtime
  namespace: default
  labels:
    app: eaos-skill-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eaos-skill-runtime
  template:
    metadata:
      labels:
        app: eaos-skill-runtime
    spec:
      containers:
        - name: skill-runtime
          image: harkro123/eaos-skill-runtime:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: eaos-skill-runtime
  namespace: default
  labels:
    app: eaos-skill-runtime
spec:
  type: ClusterIP
  selector:
    app: eaos-skill-runtime
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
