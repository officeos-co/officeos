# ─────────────────────────────────────────────────────────────────────
# Enterprise Agent OS — staging backend stack
#
# Deployed on every push to main. Uses :latest image tags.
# Shared infra (RBAC, Redis, Skill Runtime) included here.
# ─────────────────────────────────────────────────────────────────────

# ==============================================================
# RBAC — shared across staging and prod
# ==============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-backend
  namespace: default
  labels:
    app: eaos

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zeroclaw-manager
  namespace: default
  labels:
    app: eaos
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - persistentvolumeclaims
      - configmaps
    verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zeroclaw-manager-binding
  namespace: default
  labels:
    app: eaos
subjects:
  - kind: ServiceAccount
    name: dashboard-backend
    namespace: default
roleRef:
  kind: Role
  name: zeroclaw-manager
  apiGroup: rbac.authorization.k8s.io

---
# ==============================================================
# Backend DataProtection keys PVC — staging
# ==============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eaos-backend-staging-data
  namespace: default
  labels:
    app: eaos
    env: staging
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
# ==============================================================
# Backend — staging
# ==============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eaos-backend-staging
  namespace: default
  labels:
    app: eaos-backend-staging
    env: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eaos-backend-staging
  template:
    metadata:
      labels:
        app: eaos-backend-staging
        env: staging
    spec:
      serviceAccountName: dashboard-backend
      initContainers:
        - name: fix-data-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1654:1654 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 0
      containers:
        - name: backend
          image: harkro123/eaos-backend:latest
          imagePullPolicy: Always
          env:
            - name: ENVIRONMENT
              value: Staging
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "1000Mi"
              cpu: "1000m"
            limits:
              memory: "2000Mi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        # ── Channel gateway sidecar ───────────────────────────────
        - name: channel-gateway
          image: harkro123/eaos-channel-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3100
              name: ch-gateway
              protocol: TCP
          env:
            - name: PORT
              value: "3100"
            - name: BACKEND_URL
              value: "http://localhost:8000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eaos-backend-staging-data

---
apiVersion: v1
kind: Service
metadata:
  name: eaos-backend-staging
  namespace: default
  labels:
    app: eaos-backend-staging
    env: staging
spec:
  type: ClusterIP
  selector:
    app: eaos-backend-staging
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000

---
# ==============================================================
# Redis — shared between staging and prod (different DB numbers)
# ==============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eaos-redis
  namespace: default
  labels:
    app: eaos-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eaos-redis
  template:
    metadata:
      labels:
        app: eaos-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: eaos-redis
  namespace: default
  labels:
    app: eaos-redis
spec:
  type: ClusterIP
  selector:
    app: eaos-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379

---
# ==============================================================
# Skill Runtime — shared (single instance serves both envs)
# ==============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eaos-skill-runtime
  namespace: default
  labels:
    app: eaos-skill-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eaos-skill-runtime
  template:
    metadata:
      labels:
        app: eaos-skill-runtime
    spec:
      containers:
        - name: skill-runtime
          image: harkro123/eaos-skill-runtime:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: eaos-skill-runtime
  namespace: default
  labels:
    app: eaos-skill-runtime
spec:
  type: ClusterIP
  selector:
    app: eaos-skill-runtime
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
