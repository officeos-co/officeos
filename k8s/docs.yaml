apiVersion: apps/v1
kind: Deployment
metadata:
  name: eaos-docs-prod
  namespace: default
  labels:
    app: eaos-docs-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eaos-docs-prod
  template:
    metadata:
      labels:
        app: eaos-docs-prod
    spec:
      containers:
        - name: docs
          image: harkro123/eaos-docs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eaos-docs-prod
  namespace: default
  labels:
    app: eaos-docs-prod
spec:
  type: ClusterIP
  selector:
    app: eaos-docs-prod
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
