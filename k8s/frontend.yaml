# ─────────────────────────────────────────────────────────────────────
# Enterprise Agent OS — frontend (Next.js dashboard)
#
# Frontend-only manifest. Shared infra (RBAC, data stores, backend)
# lives in ./backend.yaml.
# ─────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eaos-frontend-prod
  namespace: default
  labels:
    app: eaos-frontend-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eaos-frontend-prod
  template:
    metadata:
      labels:
        app: eaos-frontend-prod
    spec:
      containers:
        - name: frontend
          image: harkro123/eaos-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: eaos-frontend-prod
  namespace: default
  labels:
    app: eaos-frontend-prod
spec:
  type: ClusterIP
  selector:
    app: eaos-frontend-prod
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
