apiVersion: v1
kind: Namespace
metadata:
  name: daytona-system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: daytona-dex-config
  namespace: daytona-system
data:
  config.yaml: |
    issuer: http://daytona-dex.daytona-system.svc.cluster.local:5556/dex
    storage:
      type: sqlite3
      config:
        file: /var/dex/dex.db
    web:
      http: 0.0.0.0:5556
    staticClients:
      - id: daytona
        redirectURIs:
          - http://daytona-api.daytona-system.svc.cluster.local:3000/auth/callback
          - http://localhost:3000/auth/callback
        name: Daytona
        secret: ""
    enablePasswordDB: true
    staticPasswords:
      - email: dev@daytona.io
        hash: "$2y$10$2b2ScE6k5QquTjo7yYeLeuGlUlvz9fk0VYl2r7l8pYfSsiMzEOfHm"
        username: dev
        userID: dev

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daytona-postgres-data
  namespace: daytona-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daytona-minio-data
  namespace: daytona-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daytona-registry-data
  namespace: daytona-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytona-postgres
  namespace: daytona-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytona-postgres
  template:
    metadata:
      labels:
        app: daytona-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_DB
              value: daytona
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: daytona-postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: daytona-postgres
  namespace: daytona-system
spec:
  selector:
    app: daytona-postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytona-redis
  namespace: daytona-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytona-redis
  template:
    metadata:
      labels:
        app: daytona-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: daytona-redis
  namespace: daytona-system
spec:
  selector:
    app: daytona-redis
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytona-minio
  namespace: daytona-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytona-minio
  template:
    metadata:
      labels:
        app: daytona-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: daytona-minio-data

---
apiVersion: v1
kind: Service
metadata:
  name: daytona-minio
  namespace: daytona-system
spec:
  selector:
    app: daytona-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytona-registry
  namespace: daytona-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytona-registry
  template:
    metadata:
      labels:
        app: daytona-registry
    spec:
      containers:
        - name: registry
          image: registry:2.8.2
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            - name: REGISTRY_HTTP_ADDR
              value: 0.0.0.0:6000
          ports:
            - containerPort: 6000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: daytona-registry-data

---
apiVersion: v1
kind: Service
metadata:
  name: daytona-registry
  namespace: daytona-system
spec:
  selector:
    app: daytona-registry
  ports:
    - port: 6000
      targetPort: 6000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytona-dex
  namespace: daytona-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytona-dex
  template:
    metadata:
      labels:
        app: daytona-dex
    spec:
      containers:
        - name: dex
          image: dexidp/dex:v2.42.0
          command:
            [
              "sh",
              "-c",
              "touch /var/dex/dex.db && exec dex serve /etc/dex/config.yaml",
            ]
          ports:
            - containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
            - name: data
              mountPath: /var/dex
      volumes:
        - name: config
          configMap:
            name: daytona-dex-config
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: daytona-dex
  namespace: daytona-system
spec:
  selector:
    app: daytona-dex
  ports:
    - port: 5556
      targetPort: 5556

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytona-runner
  namespace: daytona-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytona-runner
  template:
    metadata:
      labels:
        app: daytona-runner
    spec:
      containers:
        - name: runner
          image: daytonaio/daytona-runner
          securityContext:
            privileged: true
          env:
            - name: ENVIRONMENT
              value: development
            - name: API_PORT
              value: "3003"
            - name: DAYTONA_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: RUNNER_API_KEY
            - name: DAYTONA_API_URL
              value: http://daytona-api:3000/api
            - name: RUNNER_DOMAIN
              value: daytona-runner
            - name: RESOURCE_LIMITS_DISABLED
              value: "true"
            - name: AWS_ENDPOINT_URL
              value: http://daytona-minio:9000
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              value: minioadmin
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: AWS_DEFAULT_BUCKET
              value: daytona
            - name: INTER_SANDBOX_NETWORK_ENABLED
              value: "false"
          ports:
            - containerPort: 3003

---
apiVersion: v1
kind: Service
metadata:
  name: daytona-runner
  namespace: daytona-system
spec:
  selector:
    app: daytona-runner
  ports:
    - port: 3003
      targetPort: 3003

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytona-api
  namespace: daytona-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytona-api
  template:
    metadata:
      labels:
        app: daytona-api
    spec:
      containers:
        - name: api
          image: daytonaio/daytona-api
          securityContext:
            privileged: true
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DEFAULT_SNAPSHOT
              value: daytonaio/sandbox:0.5.0-slim
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: ENCRYPTION_KEY
            - name: ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: ENCRYPTION_SALT
            - name: DB_HOST
              value: daytona-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_DATABASE
              value: daytona
            - name: REDIS_HOST
              value: daytona-redis
            - name: REDIS_PORT
              value: "6379"
            - name: OIDC_CLIENT_ID
              value: daytona
            - name: OIDC_ISSUER_BASE_URL
              value: http://daytona-dex:5556/dex
            - name: PUBLIC_OIDC_DOMAIN
              value: http://daytona-dex.daytona-system.svc.cluster.local:5556/dex
            - name: OIDC_AUDIENCE
              value: daytona
            - name: DASHBOARD_URL
              value: http://daytona-api.daytona-system.svc.cluster.local:3000/dashboard
            - name: DASHBOARD_BASE_API_URL
              value: http://daytona-api.daytona-system.svc.cluster.local:3000
            - name: TRANSIENT_REGISTRY_URL
              value: http://daytona-registry:6000
            - name: TRANSIENT_REGISTRY_ADMIN
              value: admin
            - name: TRANSIENT_REGISTRY_PASSWORD
              value: password
            - name: TRANSIENT_REGISTRY_PROJECT_ID
              value: daytona
            - name: INTERNAL_REGISTRY_URL
              value: http://daytona-registry:6000
            - name: INTERNAL_REGISTRY_ADMIN
              value: admin
            - name: INTERNAL_REGISTRY_PASSWORD
              value: password
            - name: INTERNAL_REGISTRY_PROJECT_ID
              value: daytona
            - name: S3_ENDPOINT
              value: http://daytona-minio:9000
            - name: S3_STS_ENDPOINT
              value: http://daytona-minio:9000/minio/v1/assume-role
            - name: S3_REGION
              value: us-east-1
            - name: S3_ACCESS_KEY
              value: minioadmin
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: S3_DEFAULT_BUCKET
              value: daytona
            - name: S3_ACCOUNT_ID
              value: /
            - name: S3_ROLE_NAME
              value: /
            - name: PROXY_DOMAIN
              value: daytona-proxy.daytona-system.svc.cluster.local:4000
            - name: PROXY_PROTOCOL
              value: http
            - name: PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: PROXY_API_KEY
            - name: PROXY_TEMPLATE_URL
              value: http://{{PORT}}-{{sandboxId}}.daytona-proxy.daytona-system.svc.cluster.local:4000
            - name: DEFAULT_RUNNER_DOMAIN
              value: daytona-runner:3003
            - name: DEFAULT_RUNNER_API_URL
              value: http://daytona-runner:3003
            - name: DEFAULT_RUNNER_PROXY_URL
              value: http://daytona-runner:3003
            - name: DEFAULT_RUNNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: RUNNER_API_KEY
            - name: DEFAULT_REGION_ID
              value: us
            - name: DEFAULT_REGION_NAME
              value: us
            - name: DEFAULT_REGION_ENFORCE_QUOTAS
              value: "false"
            - name: SSH_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: SSH_GATEWAY_API_KEY
            - name: RUN_MIGRATIONS
              value: "true"
            - name: SKIP_USER_EMAIL_VERIFICATION
              value: "true"
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: daytona-api
  namespace: daytona-system
spec:
  selector:
    app: daytona-api
  ports:
    - port: 3000
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytona-proxy
  namespace: daytona-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytona-proxy
  template:
    metadata:
      labels:
        app: daytona-proxy
    spec:
      containers:
        - name: proxy
          image: daytonaio/daytona-proxy
          env:
            - name: DAYTONA_API_URL
              value: http://daytona-api:3000/api
            - name: PROXY_PORT
              value: "4000"
            - name: PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: PROXY_API_KEY
            - name: PROXY_PROTOCOL
              value: http
            - name: OIDC_CLIENT_ID
              value: daytona
            - name: OIDC_DOMAIN
              value: http://daytona-dex:5556/dex
            - name: OIDC_PUBLIC_DOMAIN
              value: http://daytona-dex.daytona-system.svc.cluster.local:5556/dex
            - name: OIDC_AUDIENCE
              value: daytona
            - name: REDIS_HOST
              value: daytona-redis
            - name: REDIS_PORT
              value: "6379"
            - name: TOOLBOX_ONLY_MODE
              value: "false"
            - name: PREVIEW_WARNING_ENABLED
              value: "false"
          ports:
            - containerPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  name: daytona-proxy
  namespace: daytona-system
spec:
  selector:
    app: daytona-proxy
  ports:
    - port: 4000
      targetPort: 4000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytona-ssh-gateway
  namespace: daytona-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytona-ssh-gateway
  template:
    metadata:
      labels:
        app: daytona-ssh-gateway
    spec:
      containers:
        - name: ssh-gateway
          image: daytonaio/daytona-ssh-gateway
          env:
            - name: API_URL
              value: http://daytona-api:3000/api
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: daytona-internal-secrets
                  key: SSH_GATEWAY_API_KEY
            - name: SSH_GATEWAY_PORT
              value: "2222"
          ports:
            - containerPort: 2222

---
apiVersion: v1
kind: Service
metadata:
  name: daytona-ssh-gateway
  namespace: daytona-system
spec:
  selector:
    app: daytona-ssh-gateway
  ports:
    - port: 2222
      targetPort: 2222
