---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-runner-admin
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  labels:
    app: github-runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: github-runner

      initContainers:
        - name: install-kubectl
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - cp /opt/bitnami/kubectl/bin/kubectl /tools/kubectl && chmod +x /tools/kubectl
          volumeMounts:
            - name: tools
              mountPath: /tools

      containers:
        - name: github-runner
          image: myoung34/github-runner:2.333.0-ubuntu-noble
          securityContext:
            privileged: true
          env:
            - name: RUNNER_SCOPE
              value: "repo"
            - name: REPO_URL
              value: "https://github.com/HarKro753/routing-engine"
            - name: LABELS
              value: "self-hosted,linux,x64"
            - name: RUNNER_NAME_PREFIX
              value: "k8s-runner"
            - name: RUNNER_WORKDIR
              value: "/tmp/runner/work"
            - name: DISABLE_AUTO_UPDATE
              value: "false"
            - name: EPHEMERAL
              value: "false"
            - name: ACCESS_TOKEN
              value: "REDACTED_GITHUB_TOKEN"
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            - name: PATH
              value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/tools"
          volumeMounts:
            - name: work
              mountPath: /tmp/runner/work
            - name: tools
              mountPath: /tools
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          args:
            - "--insecure-registry=REDACTED_DOCKER_REGISTRY_IP"
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

      volumes:
        - name: work
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
        - name: tools
          emptyDir: {}
