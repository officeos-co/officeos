name: Feature Request
description: Propose a new feature or architectural change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Describe the problem and your proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or pain point does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Include architecture notes if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches were considered and why were they ruled out?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Diagrams, links, references, or anything else.
    validations:
      required: false
