name: Feature Request
description: Propose a new feature or architectural change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Describe the problem and the proposed solution. For new integrations, prefer MCP-based designs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or pain point does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Include architecture notes if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches were considered and why were they ruled out?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Diagrams, links, references, or anything else.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system is most affected?
      options:
        - Backend agent loop
        - Pod executor
        - MCP integration
        - Dashboard
        - Channels
        - Kubernetes or Helm
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Contribution Checks
      options:
        - label: This proposal avoids introducing a legacy integration path when an MCP-based path is appropriate.
          required: true
        - label: I considered security impact for credentials, execution, auth, networking, logs, and tenant isolation.
          required: true
