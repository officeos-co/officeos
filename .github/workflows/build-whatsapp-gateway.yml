name: Build WhatsApp Gateway

on:
  push:
    branches: [main]
    paths:
      - 'packages/whatsapp-gateway/**'
      - '.github/workflows/build-whatsapp-gateway.yml'

concurrency:
  group: build-whatsapp-gateway
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/whatsapp-gateway/Dockerfile
          push: true
          tags: harkro123/eaos-whatsapp-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to cluster via Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Restart backend deployment (picks up new sidecar)
        run: |
          kubectl config set-cluster nova --server=https://tailscale-operator.tail82aae1.ts.net:443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          kubectl rollout restart deployment/eaos-backend-prod
          kubectl rollout status deployment/eaos-backend-prod --timeout=180s
