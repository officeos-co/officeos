name: Build WhatsApp Gateway

on:
  push:
    branches: [main]
    paths:
      - 'packages/whatsapp-gateway/**'
      - '.github/workflows/build-whatsapp-gateway.yml'

concurrency:
  group: build-whatsapp-gateway
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/whatsapp-gateway/Dockerfile
          push: true
          tags: harkro123/eaos-whatsapp-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart backend deployment (picks up new sidecar)
        uses: steebchen/kubectl@v2.0.0
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: rollout restart deployment/eaos-backend-prod -n default
