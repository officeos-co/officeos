name: Deploy Changelog Prod

on:
  push:
    branches:
      - main
    paths:
      - 'apps/changelog/**'
      - 'changelog/**'
      - 'k8s/changelog.yaml'
      - '.github/workflows/deploy-changelog-prod.yml'

concurrency:
  group: deploy-changelog-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/changelog/Dockerfile
          push: true
          tags: harkro123/eaos-changelog:latest
          cache-from: type=gha,scope=changelog
          cache-to: type=gha,scope=changelog,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Apply manifest and restart changelog
        run: |
          kubectl config set-cluster nova --server=https://tailscale-operator.tail82aae1.ts.net:443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          kubectl apply -f k8s/changelog.yaml
          kubectl rollout restart deployment/eaos-changelog-prod
          kubectl rollout status deployment/eaos-changelog-prod --timeout=180s
