name: Build ZeroClaw Image

on:
  push:
    branches:
      - main
    paths:
      - 'packages/zeroclaw-core/**'
      - '.github/workflows/build-zeroclaw-image.yml'

concurrency:
  group: build-zeroclaw-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          # The Dockerfile copies Cargo.toml, src/, web/, etc. without
          # any `packages/zeroclaw-core/` prefix — so the context has
          # to be that directory, not the repo root.
          context: packages/zeroclaw-core
          file: packages/zeroclaw-core/Dockerfile
          push: true
          tags: |
            harkro123/zeroclaw:latest
            harkro123/zeroclaw:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=zeroclaw
          cache-to: type=gha,scope=zeroclaw,mode=max
