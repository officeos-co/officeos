name: Build Agent Core Image

on:
  push:
    branches:
      - main
    paths:
      - 'packages/agent-core/**'
      - '.github/workflows/build-zeroclaw-image.yml'

concurrency:
  group: build-zeroclaw-image
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/agent-core

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          # The Dockerfile copies Cargo.toml, src/, web/, etc. without
          # any `packages/zeroclaw-core/` prefix — so the context has
          # to be that directory, not the repo root.
          context: packages/agent-core
          file: packages/agent-core/Dockerfile
          push: true
          tags: harkro123/zeroclaw:latest
          cache-from: type=gha,scope=zeroclaw
          cache-to: type=gha,scope=zeroclaw,mode=max
