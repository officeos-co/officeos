name: Deploy Docs Prod

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'docs/**'
      - 'k8s/docs.yaml'
      - '.github/workflows/deploy-docs-prod.yml'

concurrency:
  group: deploy-docs-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docs/Dockerfile
          push: true
          tags: harkro123/eaos-docs:latest
          cache-from: type=gha,scope=docs
          cache-to: type=gha,scope=docs,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
      - name: Apply manifest and restart docs
        run: |
          kubectl config set-cluster nova --server=https://tailscale-operator.tail82aae1.ts.net:443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          kubectl apply -f k8s/docs.yaml
          kubectl rollout restart deployment/eaos-docs-prod
          kubectl rollout status deployment/eaos-docs-prod --timeout=180s
