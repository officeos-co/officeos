name: Deploy Docs Prod

# TEMPORARY: Main pushes deploy to production even without version tags.
# Change this back to tag-gated release promotion before formal prod releases.
on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "k8s/docs.yaml"
      - ".github/workflows/deploy-docs-prod.yml"

concurrency:
  group: deploy-docs-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docs/Dockerfile
          push: true
          tags: harkro123/eaos-docs:latest
          cache-from: type=gha,scope=docs
          cache-to: type=gha,scope=docs,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Apply manifest and restart docs
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
        run: |
          kubectl config set-cluster nova --server="${KUBE_SERVER}" --insecure-skip-tls-verify
          kubectl config set-credentials ci --token="${KUBE_TOKEN}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          kubectl apply --validate=false -f k8s/docs.yaml
          kubectl rollout restart deployment/eaos-docs-prod
