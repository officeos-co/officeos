name: Deploy Dashboard Prod

on:
  push:
    tags:
      - "dashboard-v*"

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/dashboard-}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/dashboard
          file: apps/dashboard/backend/Dockerfile
          push: true
          tags: |
            harkro123/eaos-backend:${{ steps.tag.outputs.version }}
            harkro123/eaos-backend:latest

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/dashboard-}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/dashboard/frontend
          file: apps/dashboard/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://dashboard.harrokrog.com
          tags: |
            harkro123/eaos-frontend:${{ steps.tag.outputs.version }}
            harkro123/eaos-frontend:latest

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KubernetesConfig
        uses: actions/checkout@v4
        with:
          repository: HarKro753/KubernetesConfig
          token: ${{ secrets.GH_PAT }}
          path: k8s-config

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to Kubernetes
        working-directory: k8s-config
        run: |
          kubectl config set-cluster nova --server=https://tailscale-operator.tail82aae1.ts.net:443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          ./deploy.sh enterprise-agent-os
          kubectl rollout status deployment/eaos-backend-prod --timeout=120s
          kubectl rollout status deployment/eaos-frontend-prod --timeout=120s
