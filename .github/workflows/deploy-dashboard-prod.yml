name: Deploy Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - "k8s/staging/frontend.yaml"
      - "k8s/prod/frontend.yaml"
      - ".github/workflows/deploy-dashboard-prod.yml"
    tags:
      - "v*"

concurrency:
  group: deploy-dashboard-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push (staging)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: harkro123/eaos-frontend:latest
          no-cache: true

      - name: Build and push (prod)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: harkro123/eaos-frontend:${{ github.ref_name }}
          no-cache: true

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
        run: |
          .github/scripts/configure-kubectl.sh

      - name: Deploy staging
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          kubectl apply --validate=false -f k8s/staging/frontend.yaml
          kubectl rollout restart deployment/eaos-frontend-staging
          kubectl rollout status deployment/eaos-frontend-staging --timeout=180s

      - name: Deploy prod
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG="${{ github.ref_name }}"
          sed -i "s|IMAGE_TAG|${TAG}|g" k8s/prod/frontend.yaml
          kubectl apply --validate=false -f k8s/prod/frontend.yaml
          kubectl rollout status deployment/eaos-frontend-prod --timeout=180s
