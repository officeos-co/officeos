name: Deploy Dashboard Prod

on:
  push:
    branches:
      - main
    paths:
      - 'apps/dashboard-2/**'
      - 'k8s/frontend.yaml'
      - '.github/workflows/deploy-dashboard-prod.yml'
  workflow_run:
    workflows: ["Deploy Backend Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-dashboard-prod
  cancel-in-progress: false

jobs:
  # Skip if triggered by a failed backend deploy
  gate:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - run: echo "Proceeding"

  test:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: apps/dashboard-2
        run: bun install --frozen-lockfile

      - name: Run contract tests
        working-directory: apps/dashboard-2
        run: bun test src/__tests__/graphql-contracts.test.ts
        env:
          GRAPHQL_SCHEMA_URL: https://api.officeos.co/api/dashboard/graphql

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard-2/Dockerfile
          push: true
          tags: harkro123/eaos-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Apply manifest and restart dashboard
        run: |
          kubectl config set-cluster nova --server=https://tailscale-operator.tail82aae1.ts.net:443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          kubectl apply -f k8s/frontend.yaml
          kubectl rollout restart deployment/eaos-frontend-prod
          kubectl rollout status deployment/eaos-frontend-prod --timeout=180s
