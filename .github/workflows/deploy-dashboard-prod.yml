name: Deploy Dashboard Prod

on:
  push:
    branches:
      - main
    paths:
      - 'apps/dashboard-2/**'
      - 'k8s/frontend.yaml'
      - '.github/workflows/deploy-dashboard-prod.yml'
  workflow_run:
    workflows: ["Deploy Backend Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-dashboard-prod
  cancel-in-progress: true

jobs:
  # When triggered by workflow_run, only proceed if the backend deploy succeeded
  # and the triggering commit also touched dashboard files.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether to run
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "Backend deploy failed — skipping"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              # Check if the backend commit also touched dashboard files
              CHANGED=$(git diff --name-only HEAD~1 HEAD -- apps/dashboard-2/ k8s/frontend.yaml || true)
              if [ -n "$CHANGED" ]; then
                echo "Backend deployed and dashboard files changed — running"
                echo "should_run=true" >> "$GITHUB_OUTPUT"
              else
                echo "Backend deployed but no dashboard changes — skipping"
                echo "should_run=false" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

  test:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: apps/dashboard-2
        run: bun install --frozen-lockfile

      - name: Check if backend also changed
        id: backend_changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- apps/backend/ || true)
          echo "changed=$( [ -n "$CHANGED" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Wait for backend schema to be live
        if: steps.backend_changed.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          echo "Backend files changed in the same commit — waiting for backend deploy..."
          for i in $(seq 1 30); do
            sleep 10
            echo "Polling backend health (attempt $i/30)..."
            if curl -sf https://api.officeos.co/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              break
            fi
          done

      - name: Run contract tests
        working-directory: apps/dashboard-2
        run: bun test src/__tests__/graphql-contracts.test.ts
        env:
          GRAPHQL_SCHEMA_URL: https://api.officeos.co/api/dashboard/graphql

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard-2/Dockerfile
          push: true
          tags: harkro123/eaos-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Apply manifest and restart dashboard
        run: |
          kubectl config set-cluster nova --server=https://tailscale-operator.tail82aae1.ts.net:443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          kubectl apply -f k8s/frontend.yaml
          kubectl rollout restart deployment/eaos-frontend-prod
          kubectl rollout status deployment/eaos-frontend-prod --timeout=180s
