name: Sync Skill Repos

on:
  push:
    branches: [main]
    paths:
      - 'packages/skills/**'

concurrency:
  group: sync-skill-repos
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed skills
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- packages/skills/ \
            | sed -n 's|^packages/skills/\([^/]*\)/.*|\1|p' \
            | sort -u \
            | tr '\n' ' ')
          echo "skills=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed skills: $CHANGED"

      - name: Sync changed skills to public repos
        if: steps.changed.outputs.skills != ''
        env:
          GH_TOKEN: ${{ secrets.SKILL_REPO_TOKEN }}
        run: |
          git config --global user.name "officeos-bot"
          git config --global user.email "bot@officeos.co"
          for skill in ${{ steps.changed.outputs.skills }}; do
            ./scripts/sync-skill-repos.sh "$skill"
          done
