name: Build Channel Gateway

on:
  push:
    branches: [main]
    paths:
      - 'apps/channels/**'
      - '.github/workflows/build-channel-gateway.yml'

concurrency:
  group: build-channel-gateway
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/channels
          file: apps/channels/Dockerfile
          push: true
          tags: harkro123/eaos-channel-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart backend deployment (picks up new sidecar)
        run: |
          kubectl config set-cluster nova --server=https://REDACTED_KUBE_SERVER_IP:6443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          kubectl rollout restart deployment/eaos-backend-prod
          kubectl rollout status deployment/eaos-backend-prod --timeout=180s
