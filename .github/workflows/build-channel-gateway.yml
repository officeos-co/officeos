name: Build Channel Gateway

# TEMPORARY: Main pushes publish the latest image and roll production without version tags.
# Change this back to tag-gated release promotion before formal prod releases.
on:
  push:
    branches: [main]
    paths:
      - "packages/channels/**"
      - ".github/workflows/build-channel-gateway.yml"

concurrency:
  group: build-channel-gateway
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: packages/channels
          file: packages/channels/Dockerfile
          push: true
          tags: harkro123/eaos-channel-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart backend deployment (picks up new sidecar)
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
        run: |
          kubectl config set-cluster nova --server="${KUBE_SERVER}" --insecure-skip-tls-verify
          kubectl config set-credentials ci --token="${KUBE_TOKEN}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          kubectl rollout restart deployment/eaos-backend-staging
          kubectl rollout restart deployment/eaos-backend-prod
