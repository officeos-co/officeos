name: Deploy Dashboard-2 Prod

on:
  push:
    branches:
      - main
    paths:
      - 'apps/dashboard-2/**'
      - 'k8s/dashboard-2.yaml'
      - '.github/workflows/deploy-dashboard-2-prod.yml'

concurrency:
  group: deploy-dashboard-2-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard-2/Dockerfile
          push: true
          tags: harkro123/eaos-dashboard-2:latest
          cache-from: type=gha,scope=dashboard-2
          cache-to: type=gha,scope=dashboard-2,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Apply manifest and restart dashboard-2
        run: |
          kubectl config set-cluster nova --server=https://tailscale-operator.tail82aae1.ts.net:443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          kubectl apply -f k8s/dashboard-2.yaml
          kubectl rollout restart deployment/eaos-dashboard-2-prod
          kubectl rollout status deployment/eaos-dashboard-2-prod --timeout=180s
