name: Deploy Backend

# TEMPORARY: Main pushes deploy to production even without version tags.
# Change this back to tag-gated release promotion before formal prod releases.
on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "k8s/staging/backend.yaml"
      - "k8s/prod/backend.yaml"
      - ".github/workflows/deploy-backend-prod.yml"
    tags:
      - "v*"

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PAT }}" | docker login -u harkro123 --password-stdin

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Building tagged release: ${VERSION}"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Building latest from main branch"
          fi

      - name: Publish container image
        working-directory: apps/backend
        run: dotnet publish src/OffceOs.csproj -c Release /t:PublishContainer /p:ContainerImageTag=${{ steps.version.outputs.tag }}

      - name: Push to Docker Hub
        run: docker push harkro123/eaos-backend:${{ steps.version.outputs.tag }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
        run: |
          kubectl config set-cluster nova --server="${KUBE_SERVER}" --insecure-skip-tls-verify
          kubectl config set-credentials ci --token="${KUBE_TOKEN}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova

      - name: Deploy staging
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          kubectl apply --validate=false -f k8s/staging/backend.yaml
          kubectl rollout restart deployment/eaos-backend-staging

      - name: Deploy prod
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          sed -i "s|IMAGE_TAG|${TAG}|g" k8s/prod/backend.yaml
          kubectl apply --validate=false -f k8s/prod/backend.yaml
          kubectl rollout restart deployment/eaos-backend-prod
