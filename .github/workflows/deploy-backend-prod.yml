name: Deploy Backend Prod

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'k8s/backend.yaml'
      - '.github/workflows/deploy-backend-prod.yml'

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build test project
        working-directory: apps/backend
        run: dotnet build EnterpriseAgentOs.Api.Tests/EnterpriseAgentOs.Api.Tests.csproj

      - name: Run integration tests
        working-directory: apps/backend
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: dotnet test EnterpriseAgentOs.Api.Tests/EnterpriseAgentOs.Api.Tests.csproj --no-build --logger "console;verbosity=normal" --blame-hang-timeout 120s

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: harkro123/eaos-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Apply manifest and restart backend
        run: |
          kubectl config set-cluster nova --server=https://tailscale-operator.tail82aae1.ts.net:443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          kubectl apply -f k8s/backend.yaml
          kubectl rollout restart deployment/eaos-backend-prod
          kubectl rollout status deployment/eaos-backend-prod --timeout=180s
