name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "k8s/staging/backend.yaml"
      - "k8s/prod/backend.yaml"
      - ".github/workflows/deploy-backend-prod.yml"
    tags:
      - "v*"

concurrency:
  group: deploy-backend-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PAT }}" | docker login -u harkro123 --password-stdin

      - name: Publish container image
        working-directory: apps/backend
        run: dotnet publish src/EnterpriseAgentOs.Api/EnterpriseAgentOs.Api.csproj -c Release /t:PublishContainer

      - name: Push to Docker Hub (staging)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: docker push harkro123/eaos-backend:latest

      - name: Tag and push to Docker Hub (prod)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          docker tag harkro123/eaos-backend:latest harkro123/eaos-backend:${{ github.ref_name }}
          docker push harkro123/eaos-backend:${{ github.ref_name }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          kubectl config set-cluster nova --server=https://REDACTED_KUBE_SERVER_IP:6443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova

      - name: Deploy staging
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          kubectl apply -f k8s/staging/backend.yaml
          kubectl rollout restart deployment/eaos-backend-staging
          kubectl rollout status deployment/eaos-backend-staging --timeout=180s

      - name: Deploy prod
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG="${{ github.ref_name }}"
          sed -i "s|IMAGE_TAG|${TAG}|g" k8s/prod/backend.yaml
          kubectl apply -f k8s/prod/backend.yaml
          kubectl rollout status deployment/eaos-backend-prod --timeout=180s
