name: Deploy Backend Prod

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            harkro123/eaos-backend:latest
            harkro123/eaos-backend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KubernetesConfig
        uses: actions/checkout@v4
        with:
          repository: HarKro753/KubernetesConfig
          token: ${{ secrets.GH_PAT }}
          path: k8s-config

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy backend via deploy.sh
        working-directory: k8s-config
        run: |
          kubectl config set-cluster nova --server=https://tailscale-operator.tail82aae1.ts.net:443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          ./deploy.sh eaos-backend
