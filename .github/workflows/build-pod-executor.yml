name: Build Pod Executor

on:
  push:
    branches: [main]
    paths:
      - "packages/pod-executor/**"
      - ".github/workflows/build-pod-executor.yml"

concurrency:
  group: build-pod-executor
  cancel-in-progress: false

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: packages/pod-executor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test -v ./...

  build:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: packages/pod-executor
          push: true
          tags: harkro123/eaos-pod-executor:latest
          cache-from: type=gha,scope=pod-executor
          cache-to: type=gha,scope=pod-executor,mode=max
