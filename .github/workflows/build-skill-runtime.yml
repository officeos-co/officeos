name: Build Skill Runtime

on:
  push:
    branches: [main]
    paths:
      - 'packages/skill-runtime/**'
      - 'packages/skill-sdk/**'
      - 'packages/skills/**'
      - '.github/workflows/build-skill-runtime.yml'

concurrency:
  group: build-skill-runtime
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/skill-runtime/Dockerfile
          push: true
          tags: harkro123/eaos-skill-runtime:latest
          cache-from: type=gha,scope=skill-runtime
          cache-to: type=gha,scope=skill-runtime,mode=max

      # Extract manifests natively so we can seed the database directly
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build SDK
        working-directory: packages/skill-sdk
        run: npm ci && npm run build

      - name: Install skill dependencies
        run: |
          for dir in packages/skills/*/; do
            [ -f "$dir/package.json" ] && (cd "$dir" && npm install) || true
          done

      - name: Build runtime and extract manifests
        working-directory: packages/skill-runtime
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: skill-manifests
          path: packages/skill-runtime/dist/manifests/all.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: skill-manifests
          path: ./manifests

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Apply manifest and restart skill-runtime
        run: |
          kubectl config set-cluster nova --server=https://tailscale-operator.tail82aae1.ts.net:443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova
          kubectl apply -f k8s/backend.yaml
          kubectl rollout restart deployment/eaos-skill-runtime
          kubectl rollout status deployment/eaos-skill-runtime --timeout=180s

      - name: Seed manifests to backend database
        run: |
          # Port-forward to backend service and POST manifests
          kubectl port-forward svc/eaos-backend-prod 5099:8000 &
          PF_PID=$!
          sleep 3
          curl -sf -X POST "http://localhost:5099/api/internal/seed-manifests" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: ${{ secrets.INTERNAL_API_TOKEN }}" \
            -d @manifests/all.json
          kill $PF_PID || true
          echo "Manifests seeded to database successfully"
