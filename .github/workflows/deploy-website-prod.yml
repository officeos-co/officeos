name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "apps/website/**"
      - "changelog/**"
      - "k8s/staging/website.yaml"
      - "k8s/prod/website.yaml"
      - ".github/workflows/deploy-website-prod.yml"
    tags:
      - "v*"

concurrency:
  group: deploy-website-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push (staging)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/website/Dockerfile
          push: true
          tags: harkro123/eaos-website:latest
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max

      - name: Build and push (prod)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/website/Dockerfile
          push: true
          tags: harkro123/eaos-website:${{ github.ref_name }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          kubectl config set-cluster nova --server=https://REDACTED_KUBE_SERVER_IP:6443 --insecure-skip-tls-verify=true
          kubectl config set-credentials ci --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova

      - name: Deploy staging
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          kubectl apply -f k8s/staging/website.yaml
          kubectl rollout restart deployment/eaos-website-staging
          kubectl rollout status deployment/eaos-website-staging --timeout=180s

      - name: Deploy prod
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG="${{ github.ref_name }}"
          sed -i "s|IMAGE_TAG|${TAG}|g" k8s/prod/website.yaml
          kubectl apply -f k8s/prod/website.yaml
          kubectl rollout status deployment/eaos-website-prod --timeout=180s
