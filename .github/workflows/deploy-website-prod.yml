name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "apps/website/**"
      - "changelog/**"
      - "k8s/staging/website.yaml"
      - "k8s/prod/website.yaml"
      - ".github/workflows/deploy-website-prod.yml"
    tags:
      - "v*"

concurrency:
  group: deploy-website-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: harkro123
          password: ${{ secrets.DOCKER_PAT }}

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Building tagged release: ${VERSION}"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Building latest from main branch"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/website/Dockerfile
          push: true
          tags: harkro123/eaos-website:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
        run: |
          kubectl config set-cluster nova --server="${KUBE_SERVER}" --insecure-skip-tls-verify
          kubectl config set-credentials ci --token="${KUBE_TOKEN}"
          kubectl config set-context nova --cluster=nova --user=ci --namespace=default
          kubectl config use-context nova

      - name: Deploy staging
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          kubectl apply --validate=false -f k8s/staging/website.yaml
          kubectl rollout restart deployment/eaos-website-staging

      - name: Deploy prod
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG="${{ github.ref_name }}"
          sed -i "s|IMAGE_TAG|${TAG}|g" k8s/prod/website.yaml
          kubectl apply --validate=false -f k8s/prod/website.yaml
          kubectl rollout restart deployment/eaos-website-prod
