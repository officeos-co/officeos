query Integrations {
  integrations {
    id
    name
    provider
    title
    description
    transportType
    command
    args
    url
    logo
    category
    credentialFieldsJson
    oauthProvider
    oauthScopesJson
    oauthConfigured
    credentialConfigured
    subtitle
    authorName
    authorUrl
    documentationUrl
    repositoryUrl
    tools {
      name
      description
    }
    capabilitiesJson
    isBuiltin
    createdAt
  }
}

query Integration($name: String!) {
  integration(name: $name) {
    id
    name
    provider
    title
    description
    transportType
    command
    args
    url
    logo
    category
    credentialFieldsJson
    oauthProvider
    oauthScopesJson
    oauthConfigured
    credentialConfigured
    subtitle
    authorName
    authorUrl
    documentationUrl
    repositoryUrl
    tools {
      name
      description
    }
    capabilitiesJson
    isBuiltin
    createdAt
  }
}

query AgentIntegrations($agentId: UUID!) {
  agentIntegrations(agentId: $agentId) {
    id
    name
    provider
    title
    description
    transportType
    logo
    category
    credentialFieldsJson
    oauthProvider
    oauthScopesJson
    oauthConfigured
    credentialConfigured
    capabilitiesJson
    isBuiltin
  }
}

mutation RegisterIntegration($input: RegisterIntegrationInput!) {
  registerIntegration(input: $input) {
    id
    name
    title
    description
    transportType
    command
    args
    url
    logo
    category
    credentialFieldsJson
    oauthProvider
    oauthScopesJson
    oauthConfigured
    credentialConfigured
    subtitle
    authorName
    authorUrl
    documentationUrl
    repositoryUrl
    tools {
      name
      description
    }
    isBuiltin
    createdAt
  }
}

mutation DeleteIntegration($name: String!) {
  deleteIntegration(name: $name)
}

mutation AssignIntegrationToAgent($agentId: UUID!, $integrationName: String!) {
  assignIntegrationToAgent(agentId: $agentId, integrationName: $integrationName)
}

mutation UnassignIntegrationFromAgent(
  $agentId: UUID!
  $integrationName: String!
) {
  unassignIntegrationFromAgent(
    agentId: $agentId
    integrationName: $integrationName
  )
}

mutation SaveIntegrationCredential(
  $integrationName: String!
  $fields: [CredentialFieldInput!]!
) {
  saveIntegrationCredential(integrationName: $integrationName, fields: $fields)
}
