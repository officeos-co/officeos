query McpServers {
  mcpServers {
    id
    name
    title
    description
    transportType
    command
    args
    url
    logo
    category
    credentialFieldsJson
    oauthProvider
    oauthScopesJson
    oauthConfigured
    credentialConfigured
    isBuiltin
    createdAt
  }
}

query McpServer($name: String!) {
  mcpServer(name: $name) {
    id
    name
    title
    description
    transportType
    command
    args
    url
    logo
    category
    credentialFieldsJson
    oauthProvider
    oauthScopesJson
    oauthConfigured
    credentialConfigured
    isBuiltin
    createdAt
  }
}

query AgentMcpServers($agentId: UUID!) {
  agentMcpServers(agentId: $agentId) {
    id
    name
    title
    description
    transportType
    logo
    category
    credentialFieldsJson
    oauthProvider
    oauthScopesJson
    oauthConfigured
    credentialConfigured
    isBuiltin
  }
}

mutation RegisterMcpServer($input: RegisterMcpServerInput!) {
  registerMcpServer(input: $input) {
    id
    name
    title
    description
    transportType
  }
}

mutation DeleteMcpServer($name: String!) {
  deleteMcpServer(name: $name)
}

mutation AssignMcpServerToAgent($agentId: UUID!, $serverName: String!) {
  assignMcpServerToAgent(agentId: $agentId, serverName: $serverName)
}

mutation UnassignMcpServerFromAgent($agentId: UUID!, $serverName: String!) {
  unassignMcpServerFromAgent(agentId: $agentId, serverName: $serverName)
}

mutation SaveMcpCredential($serverName: String!, $fields: [CredentialFieldInput!]!) {
  saveMcpCredential(serverName: $serverName, fields: $fields)
}
