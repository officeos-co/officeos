query Agents {
  agents {
    id
    name
    model
    status
    createdAt
  }
}

query Agent($id: UUID!) {
  agent(id: $id) {
    id
    name
    model
    status
    prompt
  }
}

# CreateAgentInput accepts optional toolPermissions: [ToolPermissionInput!]
# where ToolPermissionInput = { tool: String!, mode: ToolPermission! }
# ToolPermission enum is ALLOW | DENY (no ASK).
mutation CreateAgent($input: CreateAgentInput!) {
  createAgent(input: $input) {
    id
    name
  }
}

mutation UpdateAgent($id: UUID!, $input: UpdateAgentInput!) {
  updateAgent(id: $id, input: $input) {
    id
    name
  }
}

mutation DeleteAgent($id: UUID!) {
  deleteAgent(id: $id)
}
