---
apiVersion: eaos.dev/v1
kind: MemoryStore
metadata:
  name: mesh-routing-map
spec:
  displayName: Agent Mesh Routing Map
  entries:
    - key: product-agent
      content: Ask product-agent about roadmap, scope, prioritization, feature definitions, and product tradeoffs.
    - key: engineering-agent
      content: Ask engineering-agent about implementation, architecture, APIs, incidents, technical risk, and estimates.
    - key: support-agent
      content: Ask support-agent about customers, tickets, defects, escalations, and support policy.
    - key: sales-agent
      content: Ask sales-agent about prospects, pipeline, objections, commercial fit, and account context.
    - key: marketing-agent
      content: Ask marketing-agent about launches, positioning, campaigns, website copy, and content calendars.
    - key: finance-agent
      content: Ask finance-agent about budgets, revenue, invoices, renewals, costs, and forecasts.
    - key: legal-agent
      content: Ask legal-agent about contracts, privacy, risk, terms, procurement, and compliance language.
    - key: hr-agent
      content: Ask hr-agent about hiring, onboarding, policies, benefits, and team process.
    - key: operations-agent
      content: Ask operations-agent about vendors, internal process, systems, procurement, and operational runbooks.
    - key: security-agent
      content: Ask security-agent about access, vulnerabilities, security reviews, incident response, and controls.
