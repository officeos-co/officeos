services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: eaos
      POSTGRES_USER: eaos
      POSTGRES_PASSWORD: eaos
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - BROWSER_SERVICE_URL=http://browser:8000
      - BROWSER_PUBLIC_VIEW_BASE_URL=http://127.0.0.1:6080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis
      - browser

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=development
    depends_on:
      - backend

  channels:
    build:
      context: packages/channels
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  browser-node:
    build:
      context: packages/auto-browser/browser-node
    shm_size: 2gb
    environment:
      BROWSER_WIDTH: 1280
      BROWSER_HEIGHT: 800
      BROWSER_URL: about:blank
      BROWSER_WS_ENDPOINT_FILE: /data/profile/browser-ws-endpoint.txt
      PLAYWRIGHT_SERVER_HOST: 0.0.0.0
      PLAYWRIGHT_SERVER_PORT: 9223
      PLAYWRIGHT_SERVER_ADVERTISED_HOST: browser-node
    volumes:
      - browser_profile:/data/profile
      - browser_downloads:/data/downloads
    ports:
      - "127.0.0.1:6080:6080"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:6080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  browser:
    build:
      context: packages/auto-browser/controller
    depends_on:
      browser-node:
        condition: service_healthy
    environment:
      BROWSER_WS_ENDPOINT_FILE: /data/browser-profile/browser-ws-endpoint.txt
      TAKEOVER_URL: http://127.0.0.1:6080/vnc.html?autoconnect=true&resize=scale
      ARTIFACT_ROOT: /data/artifacts
      UPLOAD_ROOT: /data/uploads
      AUTH_ROOT: /data/auth
      APPROVAL_ROOT: /data/approvals
      AUDIT_ROOT: /data/audit
      SESSION_STORE_ROOT: /data/sessions
      MEMORY_ROOT: /data/memory
      MCP_TOOL_PROFILE: curated
      MAX_SESSIONS: 50
      ALLOWED_HOSTS: example.com,localhost,127.0.0.1,::1
      REQUIRE_OPERATOR_ID: "false"
      REQUIRE_AUTH_STATE_ENCRYPTION: "false"
      REQUEST_RATE_LIMIT_ENABLED: "true"
      METRICS_ENABLED: "true"
    volumes:
      - browser_data:/data
      - browser_profile:/data/browser-profile
    ports:
      - "127.0.0.1:18080:8000"

volumes:
  pgdata:
  browser_data:
  browser_profile:
  browser_downloads:
