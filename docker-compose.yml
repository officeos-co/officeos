name: enterprise-agent-os

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enterprise_agent_os
      POSTGRES_USER: eaos
      POSTGRES_PASSWORD: eaos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaos -d enterprise_agent_os"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  couchdb:
    image: couchdb:3
    environment:
      COUCHDB_USER: eaos
      COUCHDB_PASSWORD: eaos
    volumes:
      - couchdb_data:/opt/couchdb/data
    ports:
      - "127.0.0.1:5984:5984"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      # Context is the repo root because backend pyproject.toml pulls
      # in `packages/obsctl` via an editable sibling-path install.
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      # Single switch: dev | staging | production. Flip this to point
      # the local compose backend at a different hardcoded URL bundle
      # (see app/core/config.py::PROFILES). The baked .env default is
      # `production`; compose overrides to `staging` so local runs hit
      # staging URLs by default.
      ENVIRONMENT: dev
      # Where the dispatcher goes looking for an agent pod. In compose
      # the backend runs in its own network namespace, so `localhost`
      # isn't the Docker host. `host.docker.internal` resolves to the
      # host, where a `kubectl port-forward` can bridge back to the
      # nova pod (for dev/debugging). In a real in-cluster deploy,
      # UNSET this so the dispatcher falls back to the gateway's
      # cluster.local URL instead.
      ZEROCLAW_AGENT_HOST: host.docker.internal
    extra_hosts:
      # On Linux Docker Engine, `host.docker.internal` doesn't exist
      # by default — this explicit alias makes it resolve to the
      # container host. Docker Desktop (Mac/Windows) ignores this.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      couchdb:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Host kubeconfig — the backend falls back to
      # `load_kube_config()` when not running in-cluster, so agent
      # provisioning can talk to the real remote cluster from a
      # local compose stack. Safe to leave absent; the fallback
      # just returns None and the ConfigMap step no-ops.
      - ~/.kube/config:/home/appuser/.kube/config:ro

  dashboard:
    build:
      context: ./apps/dashboard
    depends_on:
      - backend
    ports:
      - "3000:3000"

  webhook-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["python", "scripts/rq-docker", "worker"]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  couchdb_data:
