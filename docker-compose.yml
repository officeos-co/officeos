services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: eaos
      POSTGRES_USER: eaos
      POSTGRES_PASSWORD: eaos
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=development
    depends_on:
      - backend

  channels:
    build:
      context: apps/channels
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  skill-runtime:
    build:
      context: .
      dockerfile: packages/skill-runtime/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
