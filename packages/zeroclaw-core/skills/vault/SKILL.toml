[skill]
name = "vault"
description = "Read, write, and search notes in the knowledge vault. The vault is an Obsidian-compatible knowledge graph for storing decisions, notes, and shared knowledge."
version = "1.0.0"
tags = ["knowledge", "memory", "notes", "obsidian"]
env_passthrough = [
  "VAULT_HOST",
  "VAULT_PORT",
  "VAULT_PROTOCOL",
  "VAULT_DATABASE",
  "VAULT_USERNAME",
  "VAULT_PASSWORD",
]

[[tools]]
name = "read_note"
description = "Read a note from the vault by path. Returns the full note content including frontmatter properties."
kind = "shell"
command = "vault read --file '{{path}}' --json"

[tools.args]
path = "Path to the note (e.g. 'decisions/use-postgres.md' or 'meeting-notes/2026-04-05.md')"

[[tools]]
name = "write_note"
description = "Create or overwrite a note in the vault. Use for updating existing notes or creating new ones at a specific path."
kind = "shell"
command = "vault write --path '{{path}}' --content '{{content}}' --force --yes"

[tools.args]
path = "Full path for the note (e.g. 'decisions/use-kubernetes.md')"
content = "Full note content in markdown (may include YAML frontmatter)"

[[tools]]
name = "create_note"
description = "Create a new note in the vault. Fails if a note already exists at the target path. Use write_note to overwrite."
kind = "shell"
command = "vault create --name '{{name}}' --content '{{content}}' --folder '{{folder}}' --yes --json"

[tools.args]
name = "Note name without extension (e.g. 'use-kubernetes')"
content = "Note content in markdown"
folder = "Target folder (e.g. 'decisions' or 'meeting-notes')"

[[tools]]
name = "search"
description = "Full-text search across all notes in the vault. Returns matching notes ranked by relevance."
kind = "shell"
command = "vault search --query '{{query}}' --json"

[tools.args]
query = "Search query (keywords or phrases)"

[[tools]]
name = "list_notes"
description = "List all notes in the vault, optionally filtered by folder."
kind = "shell"
command = "vault files --folder '{{folder}}' --json"

[tools.args]
folder = "Folder to list (e.g. 'decisions/' or leave empty for all)"

[[tools]]
name = "tags"
description = "List all tags used across vault notes with their counts."
kind = "shell"
command = "vault tags --counts --json"

[[tools]]
name = "backlinks"
description = "Find all notes that link TO a given note (incoming links). Useful for understanding how a concept is referenced across the vault."
kind = "shell"
command = "vault backlinks --file '{{path}}' --json"

[tools.args]
path = "Path of the note to find backlinks for"

[[tools]]
name = "links"
description = "Find all notes that a given note links to (outgoing links)."
kind = "shell"
command = "vault links --file '{{path}}' --json"

[tools.args]
path = "Path of the note"

[[tools]]
name = "properties"
description = "Read all frontmatter properties of a note (tags, categories, dates, custom fields)."
kind = "shell"
command = "vault properties --file '{{path}}' --json"

[tools.args]
path = "Path of the note"

[[tools]]
name = "append"
description = "Append content to the end of an existing note."
kind = "shell"
command = "vault append --file '{{path}}' --content '{{content}}'"

[tools.args]
path = "Path of the note to append to"
content = "Content to append"
